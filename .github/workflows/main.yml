name: Build SalahGuard APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find project root
        run: |
          echo "Root contents:"
          ls -la
          echo "Finding settings.gradle:"
          find . -name "settings.gradle" 2>/dev/null
          PROJ=$(dirname $(find . -name "settings.gradle" | head -1))
          echo "Project is at: $PROJ"
          echo "PROJECT_DIR=$PROJ" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build APK
        run: |
          cd $PROJECT_DIR
          gradle assembleDebug --no-daemon
        env:
          GRADLE_OPTS: "-Xmx2g"

      - uses: actions/upload-artifact@v4
        with:
          name: SalahGuard-APK
          path: "**/outputs/apk/debug/*.apk"
