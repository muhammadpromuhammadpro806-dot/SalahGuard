name: Build SalahGuard APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract project
        run: |
          unzip -o SalahGuard.zip
          RES=SalahGuard/app/src/main/res
          mkdir -p $RES/mipmap-anydpi-v26
          cat > $RES/mipmap-anydpi-v26/ic_launcher.xml << 'ICON'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/ic_launcher_background"/>
            <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          ICON
          cp $RES/mipmap-anydpi-v26/ic_launcher.xml $RES/mipmap-anydpi-v26/ic_launcher_round.xml
          for dir in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi; do
            rm -f $RES/$dir/ic_launcher.xml $RES/$dir/ic_launcher_round.xml
          done

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build APK
        run: |
          cd SalahGuard
          gradle assembleDebug --no-daemon
        env:
          GRADLE_OPTS: "-Xmx2g"

      - uses: actions/upload-artifact@v4
        with:
          name: SalahGuard-APK
          path: "**/outputs/apk/debug/*.apk"
