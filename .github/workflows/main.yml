name: Build SalahGuard APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract and fix project
        run: |
          unzip -o SalahGuard.zip
          cd SalahGuard
          RES=app/src/main/res
          # Move adaptive icons to correct v26 folder
          mkdir -p $RES/mipmap-anydpi-v26
          cp $RES/mipmap-hdpi/ic_launcher.xml $RES/mipmap-anydpi-v26/ic_launcher.xml
          cp $RES/mipmap-hdpi/ic_launcher.xml $RES/mipmap-anydpi-v26/ic_launcher_round.xml
          # Replace all mipmap folders with simple PNG-style solid color icon
          for dir in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi; do
            cat > $RES/$dir/ic_launcher.xml << 'ICON'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
            <solid android:color="#00E5A0"/>
            <corners android:radius="8dp"/>
          </shape>
          ICON
            cp $RES/$dir/ic_launcher.xml $RES/$dir/ic_launcher_round.xml
          done

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build APK
        run: |
          cd SalahGuard
          gradle assembleDebug --no-daemon
        env:
          GRADLE_OPTS: "-Xmx2g"

      - uses: actions/upload-artifact@v4
        with:
          name: SalahGuard-APK
          path: "**/outputs/apk/debug/*.apk"
