name: Build SalahGuard APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract project
        run: |
          unzip -o SalahGuard.zip
          RES=SalahGuard/app/src/main/res
          mkdir -p $RES/mipmap-anydpi-v26
          cat > $RES/mipmap-anydpi-v26/ic_launcher.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/ic_launcher_background"/>
            <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          cp $RES/mipmap-anydpi-v26/ic_launcher.xml $RES/mipmap-anydpi-v26/ic_launcher_round.xml
          for dir in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi; do
            rm -f $RES/$dir/ic_launcher.xml $RES/$dir/ic_launcher_round.xml
          done

      - name: Fix MainActivity
        run: |
          cat > SalahGuard/app/src/main/java/com/muhammadpro/salahguard/ui/MainActivity.java << 'ENDJAVA'
          package com.muhammadpro.salahguard.ui;
          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.location.Location;
          import android.location.LocationManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.view.View;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.annotation.NonNull;
          import androidx.appcompat.app.AlertDialog;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import com.muhammadpro.salahguard.R;
          import com.muhammadpro.salahguard.receiver.PrayerAlarmReceiver;
          import com.muhammadpro.salahguard.service.BlockerAccessibilityService;
          import com.muhammadpro.salahguard.utils.PrayerCalculator;
          import com.muhammadpro.salahguard.utils.PrayerTime;
          import com.muhammadpro.salahguard.utils.Prefs;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.List;
          import java.util.Locale;
          public class MainActivity extends AppCompatActivity {
              private Prefs prefs;
              private List<PrayerTime> prayerTimes;
              private Handler handler = new Handler(Looper.getMainLooper());
              private Runnable countdownRunnable;
              private TextView tvNextPrayer, tvNextTime, tvCountdown, tvDate, tvStreak;
              private View pageHome, pageApps, pageDhikr, pageSettings;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  prefs = new Prefs(this);
                  initViews();
                  checkPermissions();
                  loadPrayerTimes();
                  startCountdown();
                  checkAccessibilityService();
              }
              private void initViews() {
                  tvNextPrayer = findViewById(R.id.tv_next_prayer);
                  tvNextTime = findViewById(R.id.tv_next_time);
                  tvCountdown = findViewById(R.id.tv_countdown);
                  tvDate = findViewById(R.id.tv_date);
                  tvStreak = findViewById(R.id.tv_streak);
                  tvDate.setText(new SimpleDateFormat("EEE, dd MMM yyyy", Locale.getDefault()).format(new Date()));
                  tvStreak.setText("Day streak: " + prefs.getStreak());
                  pageHome = findViewById(R.id.page_home);
                  pageApps = findViewById(R.id.page_apps);
                  pageDhikr = findViewById(R.id.page_dhikr);
                  pageSettings = findViewById(R.id.page_settings);
                  findViewById(R.id.tab_home).setOnClickListener(v -> showPage(0));
                  findViewById(R.id.tab_apps).setOnClickListener(v -> showPage(1));
                  findViewById(R.id.tab_dhikr).setOnClickListener(v -> showPage(2));
                  findViewById(R.id.tab_settings).setOnClickListener(v -> showPage(3));
                  findViewById(R.id.btn_go_pray).setOnClickListener(v -> startActivity(new Intent(this, GoPrayActivity.class)));
                  findViewById(R.id.btn_manage_apps).setOnClickListener(v -> startActivity(new Intent(this, AppPickerActivity.class)));
                  findViewById(R.id.btn_mode_soft).setOnClickListener(v -> setFocusMode(1));
                  findViewById(R.id.btn_mode_firm).setOnClickListener(v -> setFocusMode(2));
                  findViewById(R.id.btn_mode_hard).setOnClickListener(v -> setFocusMode(3));
                  findViewById(R.id.btn_accessibility).setOnClickListener(v -> startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)));
                  findViewById(R.id.btn_open_dw).setOnClickListener(v -> openDigitalWellbeing());
              }
              private void showPage(int i) {
                  pageHome.setVisibility(i==0?View.VISIBLE:View.GONE);
                  pageApps.setVisibility(i==1?View.VISIBLE:View.GONE);
                  pageDhikr.setVisibility(i==2?View.VISIBLE:View.GONE);
                  pageSettings.setVisibility(i==3?View.VISIBLE:View.GONE);
              }
              private void setFocusMode(int mode) {
                  prefs.setFocusMode(mode);
                  String[] l = {"","Soft mode","Firm mode","Hard mode"};
                  Toast.makeText(this, l[mode] + " active", Toast.LENGTH_SHORT).show();
              }
              private void loadPrayerTimes() {
                  if (prefs.hasLocation()) { calculateAndDisplay(); } else { requestLocation(); }
              }
              private void calculateAndDisplay() {
                  PrayerCalculator calc = new PrayerCalculator(prefs.getLat(), prefs.getLng());
                  prayerTimes = calc.getPrayerTimes();
                  displayPrayerTimes();
                  PrayerAlarmReceiver.scheduleAllAlarms(this);
              }
              private void displayPrayerTimes() {
                  if (prayerTimes == null) return;
                  long now = System.currentTimeMillis();
                  int[] views = {R.id.tv_fajr_time,R.id.tv_dhuhr_time,R.id.tv_asr_time,R.id.tv_maghrib_time,R.id.tv_isha_time};
                  PrayerTime next = null;
                  for (int i = 0; i < prayerTimes.size() && i < views.length; i++) {
                      PrayerTime pt = prayerTimes.get(i);
                      TextView tv = findViewById(views[i]);
                      if (tv != null) tv.setText(pt.getFormattedTime());
                      if (pt.timeMillis > now && next == null) next = pt;
                  }
                  if (next != null) { tvNextPrayer.setText(next.name); tvNextTime.setText(next.getFormattedTime()); }
              }
              private void startCountdown() {
                  countdownRunnable = new Runnable() {
                      @Override public void run() { updateCountdown(); handler.postDelayed(this, 1000); }
                  };
                  handler.post(countdownRunnable);
              }
              private void updateCountdown() {
                  if (prayerTimes == null) return;
                  long now = System.currentTimeMillis();
                  PrayerTime next = null;
                  for (PrayerTime pt : prayerTimes) { if (pt.timeMillis > now) { next = pt; break; } }
                  if (next == null) { tvCountdown.setText("--:--:--"); return; }
                  long diff = next.timeMillis - now;
                  long h = diff/3600000, m = (diff%3600000)/60000, s = (diff%60000)/1000;
                  tvCountdown.setText(String.format(Locale.getDefault(), "%02d:%02d:%02d", h, m, s));
              }
              private void checkAccessibilityService() {
                  if (!BlockerAccessibilityService.isEnabled(this)) {
                      new AlertDialog.Builder(this)
                          .setTitle("Enable Accessibility Service")
                          .setMessage("SalahGuard needs Accessibility permission to block apps.\n\nTap OK then find SalahGuard and enable it.")
                          .setPositiveButton("Open Settings", (d,w) -> startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)))
                          .setNegativeButton("Later", null).show();
                  }
              }
              private void openDigitalWellbeing() {
                  try { startActivity(new Intent("android.settings.ACTION_DIGITAL_WELLBEING_SETTINGS")); }
                  catch (Exception e) { Toast.makeText(this, "Go to Settings > Digital Wellbeing manually", Toast.LENGTH_LONG).show(); }
              }
              private void checkPermissions() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED)
                          requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 1);
                  }
                  if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED)
                      ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.ACCESS_FINE_LOCATION}, 2);
              }
              private void requestLocation() {
                  if (ActivityCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED) {
                      LocationManager lm = (LocationManager) getSystemService(LOCATION_SERVICE);
                      Location loc = null;
                      try {
                          loc = lm.getLastKnownLocation(LocationManager.GPS_PROVIDER);
                          if (loc == null) loc = lm.getLastKnownLocation(LocationManager.NETWORK_PROVIDER);
                      } catch (Exception e) { e.printStackTrace(); }
                      if (loc != null) { prefs.setLocation(loc.getLatitude(), loc.getLongitude()); }
                      else { prefs.setLocation(21.3891, 39.8579); Toast.makeText(this, "Using Makkah as default location", Toast.LENGTH_LONG).show(); }
                      calculateAndDisplay();
                  }
              }
              @Override
              public void onRequestPermissionsResult(int req, @NonNull String[] p, @NonNull int[] r) {
                  super.onRequestPermissionsResult(req, p, r);
                  if (req == 2 && r.length > 0 && r[0] == PackageManager.PERMISSION_GRANTED) requestLocation();
              }
              @Override protected void onDestroy() { super.onDestroy(); handler.removeCallbacks(countdownRunnable); }
          }
          ENDJAVA

      - name: Fix AppPickerActivity
        run: |
          cat > SalahGuard/app/src/main/java/com/muhammadpro/salahguard/ui/AppPickerActivity.java << 'ENDJAVA'
          package com.muhammadpro.salahguard.ui;
          import android.app.Activity;
          import android.content.pm.ApplicationInfo;
          import android.content.pm.PackageManager;
          import android.os.AsyncTask;
          import android.os.Bundle;
          import android.widget.ArrayAdapter;
          import android.widget.Button;
          import android.widget.ListView;
          import android.widget.Toast;
          import com.muhammadpro.salahguard.R;
          import com.muhammadpro.salahguard.utils.Prefs;
          import java.util.ArrayList;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Set;
          public class AppPickerActivity extends Activity {
              private Prefs prefs;
              private final List<String> appNames = new ArrayList<>();
              private final List<String> appPackages = new ArrayList<>();
              private ListView listView;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_app_picker);
                  prefs = new Prefs(this);
                  listView = findViewById(R.id.lv_apps);
                  listView.setChoiceMode(ListView.CHOICE_MODE_MULTIPLE);
                  findViewById(R.id.btn_back_picker).setOnClickListener(v -> finish());
                  findViewById(R.id.btn_save_apps).setOnClickListener(v -> saveApps());
                  new LoadAppsTask().execute();
              }
              private void saveApps() {
                  Set<String> blocked = new HashSet<>();
                  for (int i = 0; i < appPackages.size(); i++)
                      if (listView.isItemChecked(i)) blocked.add(appPackages.get(i));
                  prefs.setBlockedApps(blocked);
                  Toast.makeText(this, "Saved! " + blocked.size() + " apps will be blocked", Toast.LENGTH_SHORT).show();
                  finish();
              }
              private class LoadAppsTask extends AsyncTask<Void, Void, Void> {
                  @Override
                  protected Void doInBackground(Void... v) {
                      PackageManager pm = getPackageManager();
                      List<ApplicationInfo> all = pm.getInstalledApplications(0);
                      for (ApplicationInfo app : all) {
                          if ((app.flags & ApplicationInfo.FLAG_SYSTEM) != 0) continue;
                          if (app.packageName.equals(getPackageName())) continue;
                          appNames.add(pm.getApplicationLabel(app).toString());
                          appPackages.add(app.packageName);
                      }
                      return null;
                  }
                  @Override
                  protected void onPostExecute(Void v) {
                      Set<String> blocked = prefs.getBlockedApps();
                      ArrayAdapter<String> adapter = new ArrayAdapter<>(AppPickerActivity.this,
                          android.R.layout.simple_list_item_multiple_choice, appNames);
                      listView.setAdapter(adapter);
                      for (int i = 0; i < appPackages.size(); i++)
                          if (blocked.contains(appPackages.get(i))) listView.setItemChecked(i, true);
                  }
              }
          }
          ENDJAVA

      - name: Remove play-services from build.gradle
        run: |
          sed -i '/play-services-location/d' SalahGuard/app/build.gradle
          cat SalahGuard/app/build.gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build APK
        run: |
          cd SalahGuard
          gradle assembleDebug --no-daemon
        env:
          GRADLE_OPTS: "-Xmx2g"

      - uses: actions/upload-artifact@v4
        with:
          name: SalahGuard-APK
          path: "**/outputs/apk/debug/*.apk"
