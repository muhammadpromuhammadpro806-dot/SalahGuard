<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SalahGuard — Prayer Times, Qibla &amp; Quran</title>
<meta name="description" content="SalahGuard — a premium Islamic companion app for prayer times, Qibla direction, Quran, duas and more.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@400;500;600;700;800&family=Amiri:wght@400;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<!-- Firebase (compat SDK — simplest to use in a single plain-script file, no bundler needed) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
/* ============================================================
   SalahGuard — Design Tokens
   A calm, mosque-at-dusk palette: ink-emerald darks, warm gold
   accent, sand light mode. Not the generic cream+terracotta or
   pure-black+neon combos — grounded in real mosque materials:
   patinated brass, lantern glass, courtyard stone.
   ============================================================ */
:root{
  --radius-lg: 26px;
  --radius-md: 18px;
  --radius-sm: 12px;
  --font-display: 'Marcellus', 'Amiri', serif;
  --font-body: 'Manrope', -apple-system, sans-serif;
  --font-arabic: 'Amiri', serif;
  --font-mono: 'JetBrains Mono', monospace;
  --shadow-soft: 0 12px 40px -12px rgba(0,0,0,0.45);
  --shadow-lift: 0 20px 60px -16px rgba(0,0,0,0.55);
  --ease: cubic-bezier(.22,.9,.32,1);

  /* accent palettes (overridden by [data-accent]) */
  --accent: #D4AF6A;
  --accent-ink: #3A2E12;
  --accent-soft: rgba(212,175,106,0.16);
}

/* ---- Theme: Dark (default) ---- */
[data-theme="dark"]{
  --bg: #0A1613;
  --bg-elev: #0F1E19;
  --surface: #132720;
  --surface-2: #172F27;
  --surface-glass: rgba(19,39,32,0.62);
  --border: rgba(255,255,255,0.07);
  --text: #EEF3EF;
  --text-dim: #9FB3AA;
  --text-faint: #6D8079;
  --success:#4FBE8E; --danger:#E2685C; --warning:#E3B65B;
}
/* ---- Theme: AMOLED ---- */
[data-theme="amoled"]{
  --bg: #000000;
  --bg-elev: #060A08;
  --surface: #0A0F0D;
  --surface-2: #101613;
  --surface-glass: rgba(10,15,13,0.7);
  --border: rgba(255,255,255,0.08);
  --text: #F2F5F3;
  --text-dim: #93A79E;
  --text-faint: #5E6F68;
  --success:#4FBE8E; --danger:#E2685C; --warning:#E3B65B;
}
/* ---- Theme: Light ---- */
[data-theme="light"]{
  --bg: #F3EFE4;
  --bg-elev: #FBF9F3;
  --surface: #FFFFFF;
  --surface-2: #F6F2E8;
  --surface-glass: rgba(255,255,255,0.6);
  --border: rgba(20,30,25,0.08);
  --text: #17231E;
  --text-dim: #58685F;
  --text-faint: #8B978F;
  --success:#2E8F63; --danger:#C74A3E; --warning:#B8842E;
}

/* ---- Accent palettes ---- */
[data-accent="gold"]{ --accent:#D4AF6A; --accent-ink:#332508; --accent-soft:rgba(212,175,106,0.16); }
[data-accent="teal"]{ --accent:#2FA98C; --accent-ink:#052620; --accent-soft:rgba(47,169,140,0.16); }
[data-accent="rose"]{ --accent:#CC8A8F; --accent-ink:#341012; --accent-soft:rgba(204,138,143,0.16); }
[data-accent="violet"]{ --accent:#9A8AD1; --accent-ink:#1c1533; --accent-soft:rgba(154,138,209,0.18); }
[data-accent="sky"]{ --accent:#6FA8C9; --accent-ink:#0c2330; --accent-soft:rgba(111,168,201,0.16); }

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; }
body{
  font-family:var(--font-body);
  background: var(--bg-elev);
  color:var(--text);
  min-height:100vh;
  display:flex; align-items:center; justify-content:center;
  overflow-x:hidden;
}
@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
}
button{ font-family:inherit; }
h1,h2,h3,h4{ font-family:var(--font-display); font-weight:400; margin:0; letter-spacing:.2px; }
p{ margin:0; }
a{ color:inherit; }
::selection{ background:var(--accent-soft); }

/* ============ Device frame (desktop preview shell) ============ */
#device-wrap{
  width:100%;
  min-height:100vh;
  display:flex; align-items:center; justify-content:center;
  padding:18px;
  background:
    radial-gradient(1200px 700px at 20% -10%, rgba(212,175,106,0.07), transparent 60%),
    radial-gradient(1000px 800px at 100% 100%, rgba(47,169,140,0.06), transparent 60%),
    var(--bg-elev);
}
.device{
  position:relative;
  width:412px; max-width:100vw;
  height:890px; max-height:100vh;
  background:var(--bg);
  border-radius:44px;
  overflow:hidden;
  box-shadow: var(--shadow-lift), 0 0 0 10px #0d0d0d, 0 0 0 11px rgba(255,255,255,0.06);
  display:flex; flex-direction:column;
  transition:background .4s var(--ease);
}
@media (min-width:481px){
  .device{ border-radius:44px; }
}
@media (max-width:480px){
  .device{ border-radius:0; box-shadow:none; height:100vh; }
  #device-wrap{ padding:0; }
}

.statusbar{
  height:env(safe-area-inset-top, 14px);
  min-height:14px;
  flex-shrink:0;
}

/* ============ Top App Bar ============ */
.appbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 20px 14px;
  flex-shrink:0;
  position:relative; z-index:5;
}
.appbar .brand{ display:flex; align-items:center; gap:10px; }
.brand-mark{
  width:34px; height:34px; border-radius:10px;
  background:linear-gradient(155deg, var(--accent), color-mix(in srgb, var(--accent) 60%, #000));
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); color:var(--accent-ink); font-size:17px; font-weight:700;
  box-shadow:0 6px 16px -4px var(--accent-soft);
}
.brand-name{ font-family:var(--font-display); font-size:19px; letter-spacing:.3px; }
.appbar-icons{ display:flex; gap:6px; }
.icon-btn{
  width:38px; height:38px; border-radius:12px; border:none;
  background:var(--surface); color:var(--text-dim);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:transform .15s var(--ease), background .2s, color .2s;
}
.icon-btn:active{ transform:scale(.9); }
.icon-btn:hover{ color:var(--text); }
.icon-btn svg{ width:18px; height:18px; }

/* ============ View root & page transitions ============ */
#view-root{
  flex:1; min-height:0; position:relative; overflow:hidden;
}
.page{
  position:absolute; inset:0;
  overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:2px 20px 100px;
  opacity:0; transform:translateY(14px) scale(.995);
  pointer-events:none;
  transition:opacity .38s var(--ease), transform .38s var(--ease);
  scrollbar-width:none;
}
.page::-webkit-scrollbar{ display:none; }
.page.active{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
.page.no-pad{ padding-left:0; padding-right:0; }

/* ============ Bottom Tab Bar ============ */
.tabbar{
  flex-shrink:0;
  display:flex;
  padding:8px 14px calc(10px + env(safe-area-inset-bottom));
  gap:4px;
  background:var(--surface-glass);
  backdrop-filter:blur(20px) saturate(1.4);
  -webkit-backdrop-filter:blur(20px) saturate(1.4);
  border-top:1px solid var(--border);
  position:relative; z-index:6;
}
.tab-btn{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:7px 2px; border:none; background:none; color:var(--text-faint);
  cursor:pointer; border-radius:14px; transition:color .2s, background .2s;
  font-size:10.5px; font-weight:600;
}
.tab-btn svg{ width:21px; height:21px; transition:transform .25s var(--ease); }
.tab-btn.active{ color:var(--accent); }
.tab-btn.active svg{ transform:translateY(-2px) scale(1.05); }
.tab-btn:active svg{ transform:scale(.85); }

/* ============ Cards & primitives ============ */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  padding:18px;
}
.card-tight{ padding:14px 16px; }
.section-title{
  display:flex; align-items:center; justify-content:space-between;
  margin:22px 0 12px;
}
.section-title h3{ font-size:15px; color:var(--text-dim); font-weight:600; font-family:var(--font-body); text-transform:uppercase; letter-spacing:1.2px; }
.link-btn{ background:none; border:none; color:var(--accent); font-weight:700; font-size:13px; cursor:pointer; padding:4px; }

.btn{
  display:flex; align-items:center; justify-content:center; gap:8px;
  width:100%; padding:15px 18px; border-radius:16px; border:none;
  font-weight:700; font-size:15px; cursor:pointer;
  transition:transform .15s var(--ease), filter .2s, box-shadow .2s;
}
.btn:active{ transform:scale(.97); }
.btn-primary{ background:linear-gradient(155deg, var(--accent), color-mix(in srgb, var(--accent) 75%, #000)); color:var(--accent-ink); box-shadow:0 10px 26px -10px var(--accent-soft); }
.btn-primary:hover{ filter:brightness(1.06); }
.btn-ghost{ background:var(--surface); color:var(--text); border:1px solid var(--border); }
.btn-outline{ background:transparent; color:var(--accent); border:1.5px solid var(--accent); }
.btn-danger{ background:color-mix(in srgb, var(--danger) 16%, transparent); color:var(--danger); border:1px solid color-mix(in srgb, var(--danger) 40%, transparent); }
.btn-sm{ padding:9px 14px; font-size:12.5px; width:auto; border-radius:12px; }
.btn[disabled]{ opacity:.5; pointer-events:none; }

.field{ margin-bottom:14px; }
.field label{ display:block; font-size:12.5px; font-weight:700; color:var(--text-dim); margin-bottom:7px; letter-spacing:.2px; }
.input-wrap{ position:relative; }
.field input, .field select, .field textarea{
  width:100%; padding:14px 15px; border-radius:14px; border:1.5px solid var(--border);
  background:var(--surface); color:var(--text); font-size:14.5px; font-family:inherit;
  outline:none; transition:border-color .2s, background .2s;
}
.field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--accent); }
.field .toggle-eye{ position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--text-faint); cursor:pointer; }
.field-hint{ font-size:11.5px; color:var(--text-faint); margin-top:6px; }
.field-error{ font-size:11.5px; color:var(--danger); margin-top:6px; display:none; }
.field.invalid input{ border-color:var(--danger); }
.field.invalid .field-error{ display:block; }

.chip{
  display:inline-flex; align-items:center; gap:6px;
  padding:8px 13px; border-radius:100px; background:var(--surface-2);
  border:1px solid var(--border); font-size:12.5px; font-weight:700; color:var(--text-dim);
  cursor:pointer; transition:all .2s var(--ease); white-space:nowrap;
}
.chip.active{ background:var(--accent-soft); color:var(--accent); border-color:transparent; }
.chip-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
.chip-row::-webkit-scrollbar{ display:none; }

.divider{ height:1px; background:var(--border); margin:16px 0; }

.badge{ font-size:10.5px; font-weight:800; padding:3px 8px; border-radius:8px; letter-spacing:.3px; }
.badge-accent{ background:var(--accent-soft); color:var(--accent); }
.badge-danger{ background:color-mix(in srgb, var(--danger) 18%, transparent); color:var(--danger); }
.badge-success{ background:color-mix(in srgb, var(--success) 18%, transparent); color:var(--success); }
.badge-warn{ background:color-mix(in srgb, var(--warning) 20%, transparent); color:var(--warning); }

/* ============ Skeleton loaders ============ */
.skel{ position:relative; overflow:hidden; background:var(--surface-2); border-radius:10px; }
.skel::after{
  content:''; position:absolute; inset:0; transform:translateX(-100%);
  background:linear-gradient(90deg, transparent, rgba(255,255,255,0.09), transparent);
  animation:shimmer 1.4s infinite;
}
@keyframes shimmer{ 100%{ transform:translateX(100%); } }

/* ============ Toasts ============ */
#toast-root{ position:absolute; left:0; right:0; bottom:96px; display:flex; flex-direction:column; align-items:center; gap:8px; z-index:80; pointer-events:none; padding:0 20px;}
.toast{
  background:var(--surface); border:1px solid var(--border); color:var(--text);
  padding:12px 18px; border-radius:14px; font-size:13.5px; font-weight:600;
  box-shadow:var(--shadow-soft); display:flex; align-items:center; gap:9px;
  animation:toast-in .35s var(--ease); max-width:100%;
}
.toast.success{ border-color:color-mix(in srgb, var(--success) 40%, transparent); }
.toast.error{ border-color:color-mix(in srgb, var(--danger) 40%, transparent); }
@keyframes toast-in{ from{ opacity:0; transform:translateY(10px) scale(.95); } to{ opacity:1; transform:translateY(0) scale(1); } }
.toast.leaving{ animation:toast-out .3s var(--ease) forwards; }
@keyframes toast-out{ to{ opacity:0; transform:translateY(6px) scale(.96); } }

/* ============ Modal ============ */
#modal-root{ position:absolute; inset:0; z-index:90; display:none; }
#modal-root.open{ display:block; }
.modal-backdrop{ position:absolute; inset:0; background:rgba(0,0,0,0.55); backdrop-filter:blur(3px); animation:fade-in .25s var(--ease); }
@keyframes fade-in{ from{opacity:0;} to{opacity:1;} }
.modal-sheet{
  position:absolute; left:0; right:0; bottom:0; background:var(--bg);
  border-radius:26px 26px 0 0; padding:22px 20px calc(24px + env(safe-area-inset-bottom));
  max-height:88%; overflow-y:auto; border:1px solid var(--border); border-bottom:none;
  animation:sheet-up .35s var(--ease);
  box-shadow:0 -20px 60px -20px rgba(0,0,0,0.5);
}
@keyframes sheet-up{ from{ transform:translateY(100%);} to{ transform:translateY(0);} }
.modal-handle{ width:38px; height:4px; border-radius:10px; background:var(--border); margin:0 auto 16px; }
.modal-title{ font-size:19px; margin-bottom:6px; }
.modal-sub{ font-size:13px; color:var(--text-dim); margin-bottom:18px; line-height:1.5; }

/* ============ Onboarding ============ */
#onboarding{ position:absolute; inset:0; z-index:100; background:var(--bg); display:flex; flex-direction:column; }
.ob-slides{ flex:1; display:flex; overflow-x:hidden; position:relative; }
.ob-slide{ min-width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 34px; text-align:center; gap:22px; transition:opacity .4s var(--ease); }
.ob-art{ width:170px; height:170px; border-radius:50%; display:flex; align-items:center; justify-content:center; position:relative; }
.ob-art svg{ width:88px; height:88px; }
.ob-title{ font-size:25px; line-height:1.3; }
.ob-desc{ font-size:14px; color:var(--text-dim); line-height:1.6; max-width:280px; }
.ob-dots{ display:flex; gap:7px; justify-content:center; padding:10px 0 26px; }
.ob-dot{ width:7px; height:7px; border-radius:50%; background:var(--border); transition:all .3s var(--ease); }
.ob-dot.active{ width:22px; background:var(--accent); }
.ob-actions{ display:flex; gap:10px; padding:0 24px calc(28px + env(safe-area-inset-bottom)); }

/* ============ Auth ============ */
.auth-hero{ padding:34px 4px 8px; text-align:center; }
.auth-hero .brand-mark{ width:54px; height:54px; border-radius:16px; font-size:26px; margin:0 auto 16px; }
.auth-hero h1{ font-size:26px; margin-bottom:6px; }
.auth-hero p{ color:var(--text-dim); font-size:13.5px; }
.auth-tabs{ display:flex; background:var(--surface); border-radius:16px; padding:4px; margin:20px 0 22px; border:1px solid var(--border); }
.auth-tab{ flex:1; text-align:center; padding:10px 0; border-radius:12px; font-weight:700; font-size:13.5px; color:var(--text-dim); cursor:pointer; transition:all .25s var(--ease); }
.auth-tab.active{ background:var(--accent); color:var(--accent-ink); }
.strength-bar{ display:flex; gap:4px; margin-top:8px; }
.strength-bar div{ height:4px; flex:1; border-radius:4px; background:var(--surface-2); transition:background .3s; }
.remember-row{ display:flex; align-items:center; justify-content:space-between; margin:2px 0 20px; }
.check-row{ display:flex; align-items:center; gap:9px; cursor:pointer; user-select:none; }
.checkbox{ width:20px; height:20px; border-radius:7px; border:1.6px solid var(--border); display:flex; align-items:center; justify-content:center; transition:all .2s; flex-shrink:0; }
.checkbox.checked{ background:var(--accent); border-color:var(--accent); }
.checkbox.checked svg{ width:13px; height:13px; color:var(--accent-ink); }
.divider-or{ display:flex; align-items:center; gap:12px; margin:20px 0; color:var(--text-faint); font-size:12px; font-weight:700; }
.divider-or::before, .divider-or::after{ content:''; flex:1; height:1px; background:var(--border); }
.google-btn{ display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:14px; border-radius:16px; background:var(--surface); border:1.5px solid var(--border); color:var(--text); font-weight:700; font-size:14px; cursor:pointer; }
.auth-foot{ text-align:center; margin-top:20px; font-size:13px; color:var(--text-dim); padding-bottom:20px; }
.captcha-box{ background:var(--surface-2); border:1px dashed var(--border); border-radius:14px; padding:16px; text-align:center; margin-bottom:14px; }
.captcha-sum{ font-family:var(--font-mono); font-size:20px; font-weight:700; margin:8px 0 12px; letter-spacing:1px; }

/* ============ Home: Hero arch card ============ */
.greeting-row{ display:flex; align-items:center; justify-content:space-between; padding:10px 0 6px; }
.greeting-row h2{ font-size:21px; }
.greeting-row .loc{ display:flex; align-items:center; gap:5px; font-size:12.5px; color:var(--text-dim); margin-top:3px; font-weight:600; }
.greeting-row .loc svg{ width:13px; height:13px; }
.avatar{ width:42px; height:42px; border-radius:13px; background:var(--surface); display:flex; align-items:center; justify-content:center; font-weight:800; color:var(--accent); border:1px solid var(--border); overflow:hidden; cursor:pointer; }
.avatar img{ width:100%; height:100%; object-fit:cover; }

.mihrab-card{
  position:relative; margin-top:14px; border-radius:30px 30px 20px 20px;
  padding:26px 22px 22px;
  background:
    radial-gradient(120% 100% at 50% 0%, var(--accent-soft), transparent 60%),
    linear-gradient(175deg, var(--surface), var(--surface-2));
  border:1px solid var(--border);
  overflow:hidden;
}
.mihrab-card::before{
  content:''; position:absolute; inset:0; opacity:.5; pointer-events:none;
  background-image:
    radial-gradient(circle at 15% 20%, var(--border) 0.5px, transparent 0.5px),
    radial-gradient(circle at 45% 60%, var(--border) 0.5px, transparent 0.5px),
    radial-gradient(circle at 75% 30%, var(--border) 0.5px, transparent 0.5px),
    radial-gradient(circle at 90% 80%, var(--border) 0.5px, transparent 0.5px);
  background-size:60px 60px;
}
.mihrab-top{ display:flex; align-items:center; justify-content:space-between; position:relative; z-index:1; }
.mihrab-top .eyebrow{ font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-dim); font-weight:700; }
.mihrab-top .next-name{ font-family:var(--font-display); font-size:30px; margin-top:2px; }
.ring-wrap{ position:relative; width:112px; height:112px; flex-shrink:0; }
.ring-wrap svg{ width:100%; height:100%; transform:rotate(-90deg); }
.ring-wrap circle{ fill:none; stroke-linecap:round; }
.ring-bg{ stroke:var(--border); stroke-width:7; }
.ring-fg{ stroke:var(--accent); stroke-width:7; transition:stroke-dashoffset 1s linear; }
.ring-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.ring-center .t{ font-family:var(--font-mono); font-weight:600; font-size:15px; letter-spacing:.5px; }
.ring-center .l{ font-size:9.5px; color:var(--text-faint); font-weight:700; margin-top:2px; }
.mihrab-time{ font-family:var(--font-mono); font-size:15px; color:var(--text-dim); margin-top:14px; position:relative; z-index:1; }

.prayer-list{ display:flex; flex-direction:column; gap:10px; margin-top:10px; }
.prayer-row{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 16px; border-radius:18px; background:var(--surface);
  border:1px solid var(--border); transition:all .25s var(--ease);
}
.prayer-row.current{ border-color:color-mix(in srgb, var(--accent) 55%, transparent); background:var(--accent-soft); }
.prayer-row .left{ display:flex; align-items:center; gap:12px; }
.prayer-icon{ width:38px; height:38px; border-radius:12px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; color:var(--text-dim); }
.prayer-row.current .prayer-icon{ background:var(--accent); color:var(--accent-ink); }
.prayer-icon svg{ width:18px; height:18px; }
.prayer-name{ font-weight:700; font-size:14.5px; }
.prayer-sub{ font-size:11.5px; color:var(--text-faint); margin-top:1px; }
.prayer-time{ font-family:var(--font-mono); font-weight:600; font-size:15px; }

.quick-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:8px; }
.quick-item{ display:flex; flex-direction:column; align-items:center; gap:8px; padding:14px 4px; border-radius:18px; background:var(--surface); border:1px solid var(--border); cursor:pointer; transition:transform .15s var(--ease); }
.quick-item:active{ transform:scale(.93); }
.quick-item .qi-icon{ width:42px; height:42px; border-radius:13px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; color:var(--accent); }
.quick-item .qi-icon svg{ width:19px; height:19px; }
.quick-item span{ font-size:10.5px; font-weight:700; color:var(--text-dim); text-align:center; }

.pull-indicator{ display:flex; align-items:center; justify-content:center; height:0; overflow:hidden; color:var(--text-faint); font-size:11px; font-weight:700; transition:height .25s var(--ease); gap:6px; }
.pull-indicator.show{ height:34px; }
.spin{ animation:spin 1s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }

/* ============ Method / location page ============ */
.method-option{ display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-radius:16px; border:1.5px solid var(--border); margin-bottom:9px; cursor:pointer; transition:all .2s var(--ease); }
.method-option.active{ border-color:var(--accent); background:var(--accent-soft); }
.method-option .m-name{ font-weight:700; font-size:14px; }
.method-option .m-sub{ font-size:11.5px; color:var(--text-faint); margin-top:2px; }
.radio-dot{ width:20px; height:20px; border-radius:50%; border:2px solid var(--border); position:relative; flex-shrink:0; }
.method-option.active .radio-dot{ border-color:var(--accent); }
.method-option.active .radio-dot::after{ content:''; position:absolute; inset:3px; border-radius:50%; background:var(--accent); }
.week-table{ width:100%; border-collapse:collapse; font-size:12.5px; }
.week-table th{ text-align:left; color:var(--text-faint); font-weight:700; padding:8px 6px; font-size:10.5px; text-transform:uppercase; }
.week-table td{ padding:10px 6px; border-top:1px solid var(--border); font-family:var(--font-mono); }
.week-table tr.today td{ color:var(--accent); font-weight:700; }

/* ============ Qibla ============ */
.qibla-wrap{ display:flex; flex-direction:column; align-items:center; padding:24px 0 10px; }
.qibla-deg{ font-family:var(--font-mono); font-size:15px; color:var(--text-dim); margin-bottom:18px; }
.compass{ width:280px; height:280px; border-radius:50%; position:relative; background:radial-gradient(circle at 50% 40%, var(--surface-2), var(--surface)); border:1px solid var(--border); box-shadow:var(--shadow-soft); }
.compass-ring{ position:absolute; inset:14px; border-radius:50%; border:1px dashed var(--border); }
.compass-n{ position:absolute; top:22px; left:50%; transform:translateX(-50%); font-size:11px; font-weight:800; color:var(--text-faint); letter-spacing:1px; }
.needle-pivot{ position:absolute; inset:0; transition:transform .3s ease-out; }
.needle{ position:absolute; left:50%; top:50%; width:5px; height:110px; transform:translate(-50%,-100%); border-radius:6px; background:linear-gradient(180deg, var(--accent), transparent); }
.kaaba-dot{ position:absolute; left:50%; top:16px; transform:translateX(-50%); width:30px; height:30px; border-radius:9px; background:var(--accent); display:flex; align-items:center; justify-content:center; box-shadow:0 8px 20px -4px var(--accent-soft); }
.kaaba-dot svg{ width:15px; height:15px; color:var(--accent-ink); }
.center-dot{ position:absolute; left:50%; top:50%; width:10px; height:10px; border-radius:50%; background:var(--text); transform:translate(-50%,-50%); }
.qibla-note{ text-align:center; font-size:12.5px; color:var(--text-faint); margin-top:20px; padding:0 20px; line-height:1.6; }
.qibla-aligned{ color:var(--success); font-weight:800; }

/* ============ Quran ============ */
.surah-row{ display:flex; align-items:center; gap:14px; padding:14px 6px; border-bottom:1px solid var(--border); cursor:pointer; }
.surah-num{ width:36px; height:36px; border-radius:11px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:12px; font-weight:700; color:var(--accent); flex-shrink:0; }
.surah-mid{ flex:1; min-width:0; }
.surah-en{ font-weight:700; font-size:14.5px; }
.surah-sub{ font-size:11.5px; color:var(--text-faint); margin-top:1px; }
.surah-ar{ font-family:var(--font-arabic); font-size:19px; color:var(--text-dim); }
.ayah-card{ padding:20px 4px; border-bottom:1px solid var(--border); }
.ayah-ar{ font-family:var(--font-arabic); font-size:27px; line-height:2.1; text-align:right; direction:rtl; margin-bottom:12px; }
.ayah-num-badge{ display:inline-flex; width:24px; height:24px; border-radius:50%; background:var(--accent-soft); color:var(--accent); align-items:center; justify-content:center; font-size:11px; font-weight:800; font-family:var(--font-mono); margin-right:6px; }
.ayah-tr{ font-size:13.5px; color:var(--text-dim); line-height:1.7; }
.reader-toolbar{ display:flex; align-items:center; justify-content:space-between; padding:12px 0; position:sticky; top:0; background:var(--bg); z-index:3; border-bottom:1px solid var(--border); margin-bottom:6px; }

/* ============ Hadith / Duas ============ */
.hadith-card{ margin-bottom:12px; }
.hadith-card .htext{ font-size:14px; line-height:1.75; color:var(--text); margin-bottom:10px; }
.hadith-src{ font-size:11.5px; color:var(--text-faint); font-weight:700; }
.dua-card{ margin-bottom:12px; }
.dua-ar{ font-family:var(--font-arabic); font-size:22px; text-align:right; direction:rtl; line-height:1.9; margin-bottom:10px; }
.dua-translit{ font-size:12.5px; color:var(--accent); font-style:italic; margin-bottom:6px; font-weight:600; }
.dua-meaning{ font-size:13px; color:var(--text-dim); line-height:1.6; }

/* ============ Tasbih ============ */
.tasbih-wrap{ display:flex; flex-direction:column; align-items:center; padding:10px 0; }
.tasbih-dhikr{ font-family:var(--font-arabic); font-size:24px; margin-bottom:4px; }
.tasbih-mean{ font-size:12px; color:var(--text-faint); margin-bottom:22px; }
.tasbih-ring{ width:230px; height:230px; border-radius:50%; position:relative; cursor:pointer; user-select:none; }
.tasbih-ring svg{ width:100%; height:100%; transform:rotate(-90deg); }
.tasbih-count{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.tasbih-count .n{ font-family:var(--font-mono); font-size:52px; font-weight:600; }
.tasbih-count .of{ font-size:12px; color:var(--text-faint); margin-top:2px; }
.tasbih-actions{ display:flex; gap:10px; margin-top:26px; width:100%; }
.tasbih-target-row{ display:flex; gap:8px; margin-top:20px; }

/* ============ Zakat ============ */
.zakat-result{ text-align:center; padding:26px 16px; border-radius:22px; background:var(--accent-soft); margin-top:18px; }
.zakat-result .amt{ font-family:var(--font-mono); font-size:34px; font-weight:700; color:var(--accent); }
.zakat-result .lbl{ font-size:12px; color:var(--text-dim); margin-top:4px; font-weight:700; }

/* ============ Mosques ============ */
.mosque-row{ display:flex; gap:13px; padding:14px 0; border-bottom:1px solid var(--border); }
.mosque-icon{ width:46px; height:46px; border-radius:14px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; color:var(--accent); flex-shrink:0; }
.mosque-name{ font-weight:700; font-size:14.5px; }
.mosque-sub{ font-size:11.5px; color:var(--text-faint); margin-top:2px; }
.mosque-dist{ font-family:var(--font-mono); font-size:12px; color:var(--accent); font-weight:700; white-space:nowrap; }

/* ============ Settings / Profile ============ */
.profile-card{ display:flex; align-items:center; gap:14px; padding:18px; margin-top:6px; }
.profile-avatar{ width:60px; height:60px; border-radius:18px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:24px; color:var(--accent); overflow:hidden; position:relative; flex-shrink:0; }
.profile-avatar img{ width:100%; height:100%; object-fit:cover; }
.profile-name{ font-size:16.5px; font-weight:700; }
.profile-email{ font-size:12px; color:var(--text-faint); margin-top:2px; }
.settings-row{ display:flex; align-items:center; justify-content:space-between; padding:14px 2px; border-bottom:1px solid var(--border); cursor:pointer; }
.settings-row:last-child{ border-bottom:none; }
.settings-row .sr-left{ display:flex; align-items:center; gap:12px; }
.settings-row .sr-icon{ width:36px; height:36px; border-radius:11px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; color:var(--text-dim); flex-shrink:0; }
.settings-row .sr-icon svg{ width:17px; height:17px; }
.settings-row .sr-title{ font-size:14px; font-weight:700; }
.settings-row .sr-sub{ font-size:11.5px; color:var(--text-faint); margin-top:1px; }
.chevron{ color:var(--text-faint); }

.switch{ width:46px; height:27px; border-radius:20px; background:var(--surface-2); border:1px solid var(--border); position:relative; cursor:pointer; flex-shrink:0; transition:background .25s; }
.switch.on{ background:var(--accent); border-color:transparent; }
.switch .knob{ position:absolute; top:2px; left:2px; width:21px; height:21px; border-radius:50%; background:#fff; transition:transform .25s var(--ease); box-shadow:0 2px 6px rgba(0,0,0,0.3); }
.switch.on .knob{ transform:translateX(19px); }

.theme-opt-row{ display:flex; gap:10px; }
.theme-opt{ flex:1; padding:14px 8px; border-radius:16px; border:1.5px solid var(--border); text-align:center; cursor:pointer; transition:all .2s var(--ease); }
.theme-opt.active{ border-color:var(--accent); }
.theme-opt .swatch{ width:100%; height:44px; border-radius:11px; margin-bottom:8px; }
.theme-opt span{ font-size:11.5px; font-weight:700; color:var(--text-dim); }
.accent-row{ display:flex; gap:12px; padding:6px 0; }
.accent-dot{ width:38px; height:38px; border-radius:50%; cursor:pointer; position:relative; border:3px solid transparent; transition:all .2s var(--ease); }
.accent-dot.active{ border-color:var(--text); }
.accent-dot.active::after{ content:'✓'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px; font-weight:800; text-shadow:0 1px 3px rgba(0,0,0,.4); }

.session-row{ display:flex; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid var(--border); }
.session-icon{ width:38px; height:38px; border-radius:12px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; color:var(--text-dim); }
.blocked-row{ display:flex; align-items:center; justify-content:space-between; padding:13px 0; border-bottom:1px solid var(--border); }

/* ============ Admin ============ */
.admin-stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.admin-stat{ padding:16px; border-radius:18px; background:var(--surface); border:1px solid var(--border); }
.admin-stat .v{ font-family:var(--font-mono); font-size:24px; font-weight:700; }
.admin-stat .l{ font-size:11px; color:var(--text-faint); font-weight:700; margin-top:3px; }
.admin-table-row{ display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--border); gap:10px; }
.admin-user-name{ font-weight:700; font-size:13.5px; }
.admin-user-sub{ font-size:11px; color:var(--text-faint); }
.bar-chart{ display:flex; align-items:flex-end; gap:6px; height:100px; margin-top:10px; }
.bar-chart .bar{ flex:1; background:linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 40%, transparent)); border-radius:6px 6px 2px 2px; transition:height .6s var(--ease); }

/* ============ Empty states ============ */
.empty-state{ text-align:center; padding:50px 20px; color:var(--text-faint); }
.empty-state svg{ width:52px; height:52px; margin-bottom:14px; opacity:.6; }
.empty-state p{ font-size:13.5px; line-height:1.6; }

/* ============ Misc ============ */
.rtl{ direction:rtl; }
.center-col{ display:flex; flex-direction:column; align-items:center; text-align:center; }
.mt-page-title{ padding:18px 0 4px; }
.mt-page-title h2{ font-size:23px; }
.mt-page-title p{ font-size:13px; color:var(--text-dim); margin-top:4px; }

/* ============ Prayer Focus Lock overlay ============ */
#focus-lock-root{ position:absolute; inset:0; z-index:300; }
.focus-lock{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:16px; padding:40px 30px; text-align:center;
  background:
    radial-gradient(140% 100% at 50% 0%, var(--accent-soft), transparent 65%),
    var(--bg);
}
.focus-icon{ width:90px; height:90px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; animation:focus-pulse 2.2s ease-in-out infinite; }
.focus-icon svg{ width:42px; height:42px; }
@keyframes focus-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.08); } }
.focus-lock h2{ font-size:23px; }
.focus-lock p{ font-size:13.5px; color:var(--text-dim); max-width:270px; line-height:1.6; }
.focus-lock .btn{ max-width:280px; }

async function sha256(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function pad2(n){ return String(n).padStart(2,'0'); }
function decToClock(dec, mode24){
  if(dec==null || isNaN(dec)) return '--:--';
  dec = ((dec%24)+24)%24;
  let h = Math.floor(dec), m = Math.round((dec-h)*60);
  if(m===60){ m=0; h++; }
  h = h%24;
  if(mode24) return pad2(h)+':'+pad2(m);
  const ampm = h>=12?'PM':'AM';
  let h12 = h%12; if(h12===0) h12=12;
  return h12+':'+pad2(m)+' '+ampm;
}
function toast(msg, type, ms){
  const root = qs('#toast-root');
  const t = document.createElement('div');
  t.className = 'toast'+(type?(' '+type):'');
  t.innerHTML = (type==='success'?ic('check'):type==='error'?ic('x'):'')+`<span>${esc(msg)}</span>`;
  root.appendChild(t);
  setTimeout(()=>{ t.classList.add('leaving'); setTimeout(()=>t.remove(),300); }, ms||2600);
}

   app, surface it as a toast (and log the real error to console) instead of
   the click silently doing nothing — makes bugs visible instead of "the
   button doesn't work" with no clue why. */
window.addEventListener('error', (ev)=>{
  console.error('SalahGuard uncaught error:', ev.error || ev.message);
  try{ toast('Something went wrong — check the browser console (F12) for details.','error'); }catch(_){}
});
window.addEventListener('unhandledrejection', (ev)=>{
  console.error('SalahGuard unhandled promise rejection:', ev.reason);

});

/* ---------------------------- PRAYER CALCULATION ----------------------------
   Real solar-position astronomy (mean anomaly / ecliptic longitude / equation
   of time), independent implementation of standard public formulas. Angles
   in degrees unless noted; D2R/R2D convert to/from radians. */
const D2R = Math.PI/180, R2D = 180/Math.PI;
function julianDay(date){
  const Y=date.getUTCFullYear(), M=date.getUTCMonth()+1, D=date.getUTCDate();
  const a = Math.floor((14-M)/12), y = Y+4800-a, m = M+12*a-3;
  return D + Math.floor((153*m+2)/5) + 365*y + Math.floor(y/4) - Math.floor(y/100) + Math.floor(y/400) - 32045;
}
function sunPosition(jd){
  const Dd = jd - 2451545.0;
  const g = (357.529 + 0.98560028*Dd) % 360;
  const q = (280.459 + 0.98564736*Dd) % 360;
  const L = (q + 1.915*Math.sin(g*D2R) + 0.020*Math.sin(2*g*D2R)) % 360;
  const e = 23.439 - 0.00000036*Dd;
  const RA = (Math.atan2(Math.cos(e*D2R)*Math.sin(L*D2R), Math.cos(L*D2R)) * R2D) / 15;
  const decl = Math.asin(Math.sin(e*D2R)*Math.sin(L*D2R)) * R2D;
  let eqt = q/15 - (((RA%24)+24)%24);
  if(eqt > 12) eqt -= 24; if(eqt < -12) eqt += 24;
  return { decl, eqt };
}
function hourAngle(altDeg, lat, decl){
  const num = Math.sin(altDeg*D2R) - Math.sin(lat*D2R)*Math.sin(decl*D2R);
  const den = Math.cos(lat*D2R)*Math.cos(decl*D2R);
  let val = num/den;
  val = Math.max(-1, Math.min(1, val));
  return Math.acos(val) * R2D / 15;
}
function computePrayerTimes(date, lat, lon, tz, methodId, asrMethod){
  const method = CALC_METHODS.find(m=>m.id===methodId) || CALC_METHODS[0];
  const jd = julianDay(date);
  const {decl, eqt} = sunPosition(jd);
  const dhuhr = 12 + tz - lon/15 - eqt;
  const fajrH = hourAngle(-method.fajr, lat, decl);
  const sunriseH = hourAngle(-0.833, lat, decl);
  const asrFactor = asrMethod==='hanafi' ? 2 : 1;
  const asrAlt = R2D*Math.atan(1/(asrFactor + Math.tan(Math.abs(lat-decl)*D2R)));
  const asrH = hourAngle(asrAlt, lat, decl);
  const maghribH = sunriseH;
  const fajr = dhuhr - fajrH, sunrise = dhuhr - sunriseH, asr = dhuhr + asrH, maghrib = dhuhr + maghribH;
  let isha;
  if(method.ishaMins){ isha = maghrib + method.ishaMins/60; }
  else { const ishaH = hourAngle(-method.isha, lat, decl); isha = dhuhr + ishaH; }
  return { fajr, sunrise, dhuhr, asr, maghrib, isha };
}
function qiblaBearing(lat, lon){
  const kLat=21.4225*D2R, kLon=39.8262*D2R, phi1=lat*D2R, l1=lon*D2R;
  const dLon = kLon - l1;
  const y = Math.sin(dLon)*Math.cos(kLat);
  const x = Math.cos(phi1)*Math.sin(kLat) - Math.sin(phi1)*Math.cos(kLat)*Math.cos(dLon);
  return ((Math.atan2(y,x)*R2D)+360)%360;
}
/* Hijri (tabular/"Kuwaiti" algorithm) — standard public arithmetic conversion. Approximate ±1 day vs moon sighting. */
function gregorianToHijri(date){
  const Y=date.getFullYear(), M=date.getMonth()+1, D=date.getDate();
  let jd = Math.floor((1461*(Y+4800+Math.floor((M-14)/12)))/4)
    + Math.floor((367*(M-2-12*Math.floor((M-14)/12)))/12)
    - Math.floor((3*Math.floor((Y+4900+Math.floor((M-14)/12))/100))/4)
    + D - 32075;
  let l = jd - 1948440 + 10632;
  const n = Math.floor((l-1)/10631);
  l = l - 10631*n + 354;
  const j = Math.floor((10985-l)/5316)*Math.floor((50*l)/17719) + Math.floor(l/5670)*Math.floor((43*l)/15238);
  l = l - Math.floor((30-j)/15)*Math.floor((17719*j)/50) - Math.floor(j/16)*Math.floor((15238*j)/43) + 29;
  const month = Math.floor((24*l)/709);
  const day = l - Math.floor((709*month)/24);
  const year = 30*n + j - 30;
  return { year, month, day };
}

/* ---------------------------- AUTH (real Firebase Auth + Firestore) ----------------------------
   Requires FIREBASE_CONFIG (top of file) to be filled in with your
   project's keys, Email/Password sign-in enabled, and Firestore
   created with the security rules from the setup guide. */
const PASS_RULE = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^\w\s]).{8,}$/;
function requireFirebase(){
  if(!FIREBASE_READY) throw new Error('Firebase isn\'t configured yet — paste your project keys into FIREBASE_CONFIG at the top of the script.');
}
const Auth = {
  async signup({ name, email, password, country, city, language }){
    requireFirebase();
    if(!PASS_RULE.test(password)) throw new Error('Password does not meet the strength requirements.');
    const cred = await fbAuth.createUserWithEmailAndPassword(email, password);
    await cred.user.updateProfile({ displayName: name });
    await cred.user.sendEmailVerification();
    await db.collection('users').doc(cred.user.uid).set({ name, email, country, city, language, createdAt: Date.now() });
    return cred.user;
  },
  async login(email, password, remember){
    requireFirebase();
    await fbAuth.setPersistence(remember ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION);
    const cred = await fbAuth.signInWithEmailAndPassword(email, password);
    const devs = App.state.devices[cred.user.uid] || [];
    const isNewDevice = !devs.some(d=>d.label===deviceLabel());
    if(isNewDevice){ devs.push({ id:uid(), label:deviceLabel(), time:Date.now() }); App.state.devices[cred.user.uid]=devs; App.save('devices'); }
    return { user: cred.user, isNewDevice };
  },
  guestLogin(){
    App.state.session = { guest:true };
    Store.set('session', App.state.session);
  },
  async logout(){
    App.state.session = null; Store.remove('session');
    if(FIREBASE_READY) await fbAuth.signOut();
  },
  logoutAllDevices(){
    // A client can only ever sign out ITS OWN session. Truly revoking
    // every other device's session requires the Admin SDK's
    // `revokeRefreshTokens(uid)`, which only runs on a trusted server
    // (e.g. a Cloud Function) — never expose that capability to the browser.
    toast('Signing you out here. To force out every other device too, call a Cloud Function that runs admin.auth().revokeRefreshTokens().', null, 4500);
    return this.logout();
  },
  async deleteAccount(){
    if(!FIREBASE_READY || !fbAuth.currentUser) return this.logout();
    try{
      const uid_ = fbAuth.currentUser.uid;
      await db.collection('users').doc(uid_).delete();
      await fbAuth.currentUser.delete();
    }catch(e){
      if(e.code==='auth/requires-recent-login') throw new Error('For your security, please log out and log back in, then try deleting your account again.');
      throw e;
    }
    await this.logout();
  }
};
function deviceLabel(){
  const ua = navigator.userAgent || 'device';
  let key = Store.get('device_label', null);
  if(key) return key;
  const short = /Android/.test(ua)?'Android device':/iPhone|iPad/.test(ua)?'iOS device':/Mac/.test(ua)?'Mac':/Windows/.test(ua)?'Windows PC':'Browser';
  key = short + ' · ' + uid().slice(0,4);
  Store.set('device_label', key);
  return key;
}

/* ---------------------------- ROUTER ---------------------------- */
const TAB_ROOTS = ['home','quran','qibla','more'];
const FULLSCREEN_PAGES = ['login','signup','forgot','reset'];
const Router = {
  stack: ['home'],
  get current(){ return this.stack[this.stack.length-1]; },
  go(name, push){
    if(TAB_ROOTS.includes(name)){ this.stack = [name]; }
    else if(push!==false){ this.stack.push(name); }
    else { this.stack[this.stack.length-1] = name; }
    this.render();
  },
  replace(name){ this.stack[this.stack.length-1] = name; this.render(); },
  back(){ if(this.stack.length>1){ this.stack.pop(); this.render(); } else { this.go('home'); } },
  render(){
    (window.__cleanup||[]).forEach(fn=>{ try{ fn(); }catch(e){} });
    window.__cleanup = [];
    const name = this.current;
    const page = PAGES[name] || PAGES.home;
    const root = qs('#view-root');
    root.innerHTML = `<div class="page" id="page-el">${page.render()}</div>`;
    requestAnimationFrame(()=> qs('#page-el').classList.add('active'));
    // appbar
    const isAuth = FULLSCREEN_PAGES.includes(name);
    qs('#appbar').style.display = isAuth ? 'none' : 'flex';
    qs('#tabbar').style.display = isAuth ? 'none' : 'flex';
    qs('#btn-back').style.display = this.stack.length>1 ? 'flex' : 'none';
    qs('#btn-back').innerHTML = ic('chevronL');
    qs('#appbar-title').textContent = TAB_ROOTS.includes(name) ? 'SalahGuard' : (page.title||'');
    qs('#brand-mark-wrap').style.display = this.stack.length>1 ? 'none' : 'flex';
    renderTabbar();
    if(page.onMount) setTimeout(page.onMount, 10);
    window.scrollTo(0,0);
  }
};
function renderTabbar(){
  const tabs = [
    {id:'home', label:'Home', icon:'home'},
    {id:'quran', label:'Quran', icon:'quran'},
    {id:'qibla', label:'Qibla', icon:'compass'},
    {id:'more', label:'More', icon:'more'},

  const activeRoot = TAB_ROOTS.includes(Router.current) ? Router.current : (['profile','settings','security','privacy','sessions','blocked','data','zakat','calendar','mosques','hadith','duas','tasbih','notifications','admin','admin-users','admin-reports','admin-broadcast','admin-audit','prayer-settings'].includes(Router.current) ? 'more' : null);
  qs('#tabbar').innerHTML = tabs.map(t=>`
    <button class="tab-btn ${activeRoot===t.id?'active':''}" onclick="Router.go('${t.id}')">
      ${ic(t.icon)}<span>${t.label}</span>
    </button>`).join('');
}

const PRAYER_META = [
  {key:'fajr', label:'Fajr', icon:'crescent'},
  {key:'sunrise', label:'Sunrise', icon:'sunrise'},
  {key:'dhuhr', label:'Dhuhr', icon:'sun'},
  {key:'asr', label:'Asr', icon:'sun'},

];
function todayTimes(dateOverride){
  const s = App.state.settings;
  return computePrayerTimes(dateOverride||new Date(), s.lat, s.lon, s.tz, s.calcMethod, s.asrMethod);
}
function nowDecimalHours(){
  const d = new Date();
  return d.getHours() + d.getMinutes()/60 + d.getSeconds()/3600;
}
function nextPrayerInfo(times){
  const now = nowDecimalHours();
  const order = ['fajr','dhuhr','asr','maghrib','isha'];
  for(const key of order){ if(times[key] > now) return { key, time: times[key], secondsLeft: (times[key]-now)*3600 }; }
  const tmr = computePrayerTimes(new Date(Date.now()+86400000), App.state.settings.lat, App.state.settings.lon, App.state.settings.tz, App.state.settings.calcMethod, App.state.settings.asrMethod);
  return { key:'fajr', time: tmr.fajr, secondsLeft: (24-now+tmr.fajr)*3600, tomorrow:true };
}
function currentPrayerKey(times){
  const now = nowDecimalHours();
  const order = ['isha','maghrib','asr','dhuhr','fajr'];
  for(const key of order){ if(now >= times[key]) return key; }
  return 'isha';
}
function fmtCountdown(sec){
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  return `${pad2(h)}:${pad2(m)}:${pad2(s)}`;
}

function updateStrength(){
  const val = qs('#su-password').value;
  let score = 0;
  if(val.length>=8) score++;
  if(/[a-z]/.test(val) && /[A-Z]/.test(val)) score++;
  if(/\d/.test(val)) score++;
  if(/[^\w\s]/.test(val)) score++;
  const bars = qsa('.strength-bar div');
  const colors = ['var(--danger)','var(--warning)','var(--accent)','var(--success)'];
  bars.forEach((b,i)=>{ b.style.background = i<score ? colors[score-1] : 'var(--surface-2)'; });
}
async function doSignup(){
  const btn = qs('#signup-btn');
  const statusEl = qs('#signup-status');
  const setStatus = (msg, color) => { if(statusEl){ statusEl.textContent = msg||''; statusEl.style.color = color||'var(--text-dim)'; } };
  console.log('SalahGuard: signup button clicked');
  try{
    const name = qs('#su-name')?.value.trim();
    const email = qs('#su-email')?.value.trim();
    const password = qs('#su-password')?.value;
    const country = qs('#su-country')?.value;
    const city = qs('#su-city')?.value;
    const language = qs('#su-lang')?.value;
    const termsOk = qs('#su-terms')?.classList.contains('checked');
    if(!name || !email || !password){ setStatus('Please fill in all fields.','var(--danger)'); return toast('Please fill in all fields.','error'); }
    if(!termsOk){ setStatus('Please accept the Terms & Privacy Policy.','var(--danger)'); return toast('Please accept the Terms & Privacy Policy.','error'); }
    if(btn){ btn.disabled = true; btn.textContent = 'Creating account…'; }
    setStatus('Contacting Firebase…');
    console.log('SalahGuard: calling Auth.signup for', email, '— FIREBASE_READY =', FIREBASE_READY);
    await Auth.signup({name,email,password,country,city,language});
    console.log('SalahGuard: signup succeeded');
    const cityRec = CITIES.find(c=>c.c===city);
    if(cityRec){ Object.assign(App.state.settings, {city:cityRec.c, country:cityRec.n, lat:cityRec.lat, lon:cityRec.lon, tz:cityRec.tz}); saveSettings(); }
    setStatus('Account created!','var(--success)');
    Modal.confirm({
      title:'Check your inbox',
      sub:`We've sent a real verification link to <b>${esc(email)}</b> via Firebase. Open it, then come back and tap "I've verified".`,
      confirmLabel:"I've verified",
      onConfirm: async ()=>{ await fbAuth.currentUser.reload(); toast('Welcome to SalahGuard!','success'); Router.go('home'); }
    });
  }catch(e){
    console.error('SalahGuard signup error:', e);
    const msg = firebaseErrorMessage(e);
    setStatus(msg, 'var(--danger)');
    toast(msg,'error');
  } finally {
    if(btn){ btn.disabled = false; btn.textContent = 'Create account'; }
  }
}
async function doLogin(){
  const btn = qs('#login-btn');
  const statusEl = qs('#login-status');
  const setStatus = (msg, color) => { if(statusEl){ statusEl.textContent = msg||''; statusEl.style.color = color||'var(--text-dim)'; } };
  console.log('SalahGuard: login button clicked');
  try{
    const email = qs('#li-email')?.value.trim();
    const password = qs('#li-password')?.value;
    const remember = qs('#li-remember')?.classList.contains('checked');
    if(!email || !password){ setStatus('Enter your email and password.','var(--danger)'); return toast('Enter your email and password.','error'); }
    if(authCaptcha){
      const val = parseInt(qs('#cap-answer')?.value||'-1',10);
      if(val !== authCaptcha.answer){ setStatus('Captcha incorrect.','var(--danger)'); toast('Captcha incorrect, try again.','error'); newCaptcha(); renderCaptcha(); return; }
    }
    if(btn){ btn.disabled = true; btn.textContent = 'Signing in…'; }
    setStatus('Contacting Firebase…');
    console.log('SalahGuard: calling Auth.login for', email, '— FIREBASE_READY =', FIREBASE_READY);
    const {user, isNewDevice} = await Auth.login(email,password,remember);
    console.log('SalahGuard: login succeeded for', user.uid);
    authFailCounts[email]=0; Store.set('auth_fail_counts', authFailCounts);
    if(!user.emailVerified){ setStatus('Please verify your email first — check your inbox.','var(--danger)'); toast('Please verify your email — check your inbox for the link.','error'); return; }
    if(isNewDevice) toast('New device sign-in detected.', null, 3200);
    authCaptcha = null;
    setStatus('Signed in — redirecting…','var(--success)');
    toast('Welcome back!','success');
    Router.go('home');
  }catch(e){
    console.error('SalahGuard login error:', e);
    const msg = firebaseErrorMessage(e);
    setStatus(msg, 'var(--danger)');
    const email = qs('#li-email')?.value.trim() || '';
    authFailCounts[email] = (authFailCounts[email]||0)+1; Store.set('auth_fail_counts', authFailCounts);
    toast(msg,'error');
    if(authFailCounts[email]>=3){ newCaptcha(); renderCaptcha(); }
  } finally {
    if(btn){ btn.disabled = false; btn.textContent = 'Log in'; }
  }
}
function renderCaptcha(){
  const slot = qs('#captcha-slot'); if(!slot) return;
  if(!authCaptcha){ slot.innerHTML=''; return; }
  slot.innerHTML = `<div class="captcha-box">
    <div style="font-size:12px;color:var(--text-faint);">Multiple failed attempts — quick check</div>
    <div class="captcha-sum">${authCaptcha.a} + ${authCaptcha.b} = ?</div>
    <input type="number" id="cap-answer" placeholder="Your answer" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);text-align:center;">
  </div>`;
}
function firebaseErrorMessage(e){
  if(!e || !e.code) return e && e.message ? e.message : 'Something went wrong.';
  const map = {
    'auth/email-already-in-use':'An account with this email already exists.',
    'auth/invalid-email':'That email address looks invalid.',
    'auth/weak-password':'Password is too weak — add length, numbers and symbols.',
    'auth/user-not-found':'No account found with that email.',
    'auth/wrong-password':'Incorrect password.',
    'auth/invalid-credential':'Incorrect email or password.',
    'auth/too-many-requests':'Too many attempts — please wait a few minutes and try again.',
    'auth/unauthorized-domain':"This website's domain isn't authorized in Firebase yet — add it under Authentication → Settings → Authorized domains in the Firebase console.",
    'auth/network-request-failed':'Network error — check your internet connection and try again.',
    'auth/user-disabled':'This account has been disabled.',
    'auth/operation-not-allowed':'Email/Password sign-in isn\'t enabled yet — turn it on in Firebase Console → Authentication → Sign-in method.',
    'auth/api-key-not-valid.-please-pass-a-valid-api-key.':'Firebase API key looks invalid — double check FIREBASE_CONFIG.',
  };
  return map[e.code] || e.message || 'Something went wrong — check the browser console for details.';
}

function enableCompass(){
  function handler(e){
    let heading = e.webkitCompassHeading!=null ? e.webkitCompassHeading : (e.alpha!=null ? (360 - e.alpha) : null);
    if(heading==null) return;
    const s = App.state.settings;
    const bearing = qiblaBearing(s.lat, s.lon);
    const rel = (bearing - heading + 360) % 360;
    const pivot = qs('#needle-pivot'); if(pivot) pivot.style.transform = `rotate(${rel}deg)`;
    const note = qs('#qibla-note');
    if(note){
      const aligned = Math.abs(((rel+180)%360)-180) < 6;
      note.innerHTML = aligned ? `<span class="qibla-aligned">✓ Aligned with Qibla</span>` : `Rotate until the mosque icon points to the top of your screen.`;
    }
  }
  function start(){
    window.addEventListener('deviceorientationabsolute', handler, true);
    window.addEventListener('deviceorientation', handler, true);
    window.__cleanup.push(()=>{ window.removeEventListener('deviceorientationabsolute',handler,true); window.removeEventListener('deviceorientation',handler,true); });
    const btn = qs('#qibla-perm-btn'); if(btn) btn.style.display='none';
    toast('Live compass enabled','success');
  }
  if(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
    DeviceOrientationEvent.requestPermission().then(state=>{
      if(state==='granted') start(); else toast('Compass permission denied.','error');
    }).catch(()=> toast('Compass not available on this device.','error'));
  } else {
    start();
  }
}

const HADITH_BOOKS = [
  {id:'bukhari', label:'Sahih al-Bukhari'},
  {id:'muslim', label:'Sahih Muslim'},
  {id:'abudawud', label:'Sunan Abu Dawud'},
  {id:'tirmidhi', label:"Jami' at-Tirmidhi"},
  {id:'ibnmajah', label:'Sunan Ibn Majah'},
  {id:'nasai', label:"Sunan an-Nasa'i"},
];
let hadithActiveBook = 'bukhari';
const hadithBookCache = {};
async function loadHadithBook(id){
  if(hadithBookCache[id]) return hadithBookCache[id];
  const url = `https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/eng-${id}.min.json`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('network');
  const data = await res.json();
  const list = (data && data.hadiths) ? data.hadiths : (Array.isArray(data) ? data : []);
  hadithBookCache[id] = list;
  return list;
}

  });
}
function hadithLoadErrorHtml(e){
  console.error('SalahGuard hadith load error:', e);
  if(IS_FILE_PROTOCOL){
    return `<div class="empty-state">${ic('book')}<p>This page is open as a local file — browsers block this kind of request from file://. Serve it from a real web address (Firebase Hosting, GitHub Pages, or a local server) and it'll work.</p></div>`;
  }
  return `<div class="empty-state">${ic('book')}<p>Couldn't load this collection — check your internet connection and try again.</p></div>`;
}
async function selectHadithBook(id){
  hadithActiveBook = id;
  qsa('#hadith-book-chips .chip').forEach(c=>c.classList.toggle('active', c.dataset.id===id));
  const container = qs('#hadith-live-list'); if(!container) return;
  container.innerHTML = `<div class="skel" style="height:76px;border-radius:16px;margin-bottom:10px;"></div>`.repeat(3);
  try{
    const list = await loadHadithBook(id);
    renderHadithLive(list.slice(0,15));
  }catch(e){
    container.innerHTML = hadithLoadErrorHtml(e);
  }
}
function renderHadithLive(list){
  const container = qs('#hadith-live-list'); if(!container) return;
  if(!list.length){ container.innerHTML = `<div class="empty-state">${ic('search')}<p>No matching hadith in this book.</p></div>`; return; }
  const bookLabel = HADITH_BOOKS.find(b=>b.id===hadithActiveBook)?.label || '';
  container.innerHTML = list.map(h=>`
    <div class="card hadith-card">
      <span class="badge badge-accent" style="margin-bottom:10px;display:inline-block;">#${esc(h.hadithnumber||'')}</span>
      <div class="htext">${esc((h.text||'').slice(0,700))}${(h.text||'').length>700?'…':''}</div>
      <div class="hadith-src">${bookLabel}${h.reference?` · ${esc(h.reference.book)}:${esc(h.reference.hadith)}`:''}</div>
    </div>`).join('');
}
async function randomHadith(){
  const container = qs('#hadith-live-list'); if(!container) return;
  container.innerHTML = `<div class="skel" style="height:76px;border-radius:16px;"></div>`;
  try{
    const list = await loadHadithBook(hadithActiveBook);
    const h = list[Math.floor(Math.random()*list.length)];
    renderHadithLive([h]);
  }catch(e){ container.innerHTML = hadithLoadErrorHtml(e); }
}
async function searchHadithBook(q){
  q = q.trim().toLowerCase();
  const container = qs('#hadith-live-list'); if(!container) return;
  try{
    const list = await loadHadithBook(hadithActiveBook);
    if(!q){ renderHadithLive(list.slice(0,15)); return; }
    renderHadithLive(list.filter(h=>(h.text||'').toLowerCase().includes(q)).slice(0,30));
  }catch(e){ console.error('SalahGuard hadith search error:', e); }
}

let tasbihCount = Store.get('tasbih_count', 0);

  render(){

            <circle id="tasbih-arc" cx="110" cy="110" r="${R}" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}" style="transition:stroke-dashoffset .25s var(--ease);"></circle>
          </svg>
          <div class="tasbih-count"><div class="n" id="tasbih-n">${tasbihCount}</div><div class="of">of ${tasbihTarget}</div></div>

        </div>
        <div class="field" style="width:100%;margin-top:18px;"><label>Dhikr</label>
          <select onchange="setTasbihDhikr(this.value)">
            ${DHIKR_LIST.map((d,i)=>`<option value="${i}" ${i===tasbihDhikrIdx?'selected':''}>${d.mean}</option>`).join('')}
          </select>
        </div>
        <div class="tasbih-actions">
          <button class="btn btn-ghost" onclick="resetTasbih()">Reset</button>
          <button class="btn btn-primary" onclick="tapTasbih()">Count +1</button>
        </div>
      </div>
    `;
  },
  onMount(){
    const ring = qs('#tasbih-ring');
    ring.addEventListener('click', tapTasbih);

  }

function tapTasbih(){
  tasbihCount++;
  vibrate(12);
  if(tasbihCount>=tasbihTarget){
    vibrate([20,40,20]);
    App.state.tasbihHistory.unshift({dhikr:DHIKR_LIST[tasbihDhikrIdx].mean, count:tasbihCount, time:Date.now()});
    Store.set('tasbih_history', App.state.tasbihHistory.slice(0,50));
    toast('Target reached — counter reset','success');
    tasbihCount = 0;
  }
  Store.set('tasbih_count', tasbihCount);
  Router.replace('tasbih');
}
function resetTasbih(){ tasbihCount=0; Store.set('tasbih_count',0); Router.replace('tasbih'); }
function setTasbihTarget(t){ tasbihTarget=t; Store.set('tasbih_target',t); Router.replace('tasbih'); }
function setTasbihDhikr(i){ tasbihDhikrIdx=parseInt(i,10); Store.set('tasbih_dhikr',tasbihDhikrIdx); Router.replace('tasbih'); }

function calcZakat(){
  const num = id => parseFloat(qs('#'+id)?.value)||0;

  const el = qs('#zk-amt'); if(el) el.textContent = zakat.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
}

/* ---------------------------- PRAYER FOCUS LOCK ----------------------------
   Locks the SalahGuard screen itself at prayer time and checks in 2 minutes
   after the Adhan. IMPORTANT LIMIT: a web page can only ever cover its own
   tab/window — it cannot block other installed apps (YouTube, Instagram,
   etc.) system-wide. True cross-app blocking needs a native Android app
   using an AccessibilityService or a SYSTEM_ALERT_WINDOW overlay +
   UsageStatsManager (the same mechanisms apps like Forest or Digital
   Wellbeing use) — a completely different project from this single HTML
   file. Ask me if you'd like a walkthrough of building that natively. */
const PRAYER_ORDER = ['fajr','dhuhr','asr','maghrib','isha'];
function todayKey(d){ d = d||new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function getPrayerLog(){ return Store.get('prayer_log', {}); }
function setPrayerDone(key){
  const log = getPrayerLog(); const day = todayKey();
  log[day] = log[day]||{}; log[day][key] = true;
  Store.set('prayer_log', log);
}
function isPrayerDone(key){ const log = getPrayerLog(); return !!(log[todayKey()]||{})[key]; }
function playChime(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const now = ctx.currentTime;
    [660,880,660].forEach((f,i)=>{
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001, now+i*0.32);
      g.gain.linearRampToValueAtTime(0.22, now+i*0.32+0.06);
      g.gain.linearRampToValueAtTime(0.0001, now+i*0.32+0.3);
      o.connect(g); g.connect(ctx.destination);
      o.start(now+i*0.32); o.stop(now+i*0.32+0.32);
    });
  }catch(e){ /* Web Audio unavailable — silently skip the tone. */ }
}
let focusState = { active:false, key:null, phase:null, checkTimer:null };
function startFocusWatcher(){
  setInterval(()=>{
    if(!App.state.settings.focusLock || focusState.active) return;
    const times = todayTimes();
    const now = nowDecimalHours();
    for(const key of PRAYER_ORDER){
      if(!App.state.settings.notif[key] || isPrayerDone(key)) continue;
      if(now >= times[key] && now < times[key] + (2/60)){ triggerFocusLock(key); break; }
    }
  }, 20000);
}
function triggerFocusLock(key){
  focusState = { active:true, key, phase:'adhan', checkTimer:null };
  playChime(); vibrate([200,100,200,100,200]);
  renderFocusOverlay();
  focusState.checkTimer = setTimeout(()=>{ focusState.phase='ask'; renderFocusOverlay(); }, 2*60*1000);
}
function renderFocusOverlay(){
  const root = qs('#focus-lock-root'); if(!root) return;
  if(!focusState.active){ root.style.display='none'; root.innerHTML=''; return; }
  root.style.display='block';
  const meta = PRAYER_META.find(p=>p.key===focusState.key);
  root.innerHTML = focusState.phase==='adhan' ? `
    <div class="focus-lock">
      <div class="focus-icon">${ic('mosque')}</div>
      <h2>It's time for ${meta.label}</h2>
      <p>Put your phone down and pray — we'll check in with you in a couple of minutes.</p>
      <button class="btn btn-ghost" onclick="silenceFocus()">Silence sound</button>
    </div>` : `
    <div class="focus-lock">
      <div class="focus-icon">${ic('heart')}</div>
      <h2>Have you prayed ${meta.label}?</h2>
      <p>Confirm to unlock SalahGuard.</p>
      <button class="btn btn-primary" onclick="confirmPrayerDone()">Yes, Alhamdulillah</button>
      <button class="btn btn-ghost" onclick="snoozeFocus()">Not yet — remind me in 5 min</button>
    </div>`;
}
function silenceFocus(){ toast('Sound silenced'); }
function confirmPrayerDone(){
  setPrayerDone(focusState.key);
  clearTimeout(focusState.checkTimer);
  focusState = { active:false, key:null, phase:null, checkTimer:null };
  renderFocusOverlay();
  toast('Marked as prayed — Jazakallah khair!','success');
  if(TAB_ROOTS.includes(Router.current)) Router.render();
}
function snoozeFocus(){
  clearTimeout(focusState.checkTimer);
  focusState.checkTimer = setTimeout(()=>{ renderFocusOverlay(); }, 5*60*1000);
  toast("We'll ask again in 5 minutes");
}

/* ---------------------------- BOOTSTRAP ---------------------------- */
document.addEventListener('DOMContentLoaded', ()=>{
  applyTheme();
  const notifBtn = qs('#btn-notif'); if(notifBtn) notifBtn.innerHTML = ic('bell');
  const themeBtn = qs('#btn-theme'); if(themeBtn) themeBtn.innerHTML = ic('sliders');

  if(!App.state.onboarded){
    renderOnboarding();
    return;
  }
  qs('#onboarding').style.display = 'none';
  startFocusWatcher();
  if(IS_FILE_PROTOCOL){
    setTimeout(()=> toast("Open this from a real web address (not a double-clicked file) for sign-in and the Hadith library to work.", null, 5000), 600);
  }

  if(FIREBASE_READY){
    fbAuth.onAuthStateChanged(async (user)=>{
      App.fbUser = user;
      if(user){
        try{ const doc = await db.collection('users').doc(user.uid).get(); App.profile = doc.exists ? doc.data() : {}; }
        catch(e){ App.profile = {}; }
      } else {
        App.profile = null;
      }
      if(!window.__authResolved){
        window.__authResolved = true;
        Router.go(App.currentUser() ? 'home' : 'login');
      } else if(['home','more','profile'].includes(Router.current)){
        Router.render();
      }
    });
  } else {
    Router.go(App.currentUser() ? 'home' : 'login');
  }
});
</script>
